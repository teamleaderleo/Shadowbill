<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shadowbill</title>
    <style>
      body { font: 14px system-ui, sans-serif; width: 290px; margin: 16px; }
      label { display: block; margin: 12px 0 4px; }
      input, select { box-sizing: border-box; width: 100%; padding: 7px; }
      button { margin-top: 14px; width: 100%; padding: 8px; }
      #status { margin-top: 10px; min-height: 18px; }
      .row { display: flex; align-items: center; gap: 8px; }
      .row input { width: auto; }
    </style>
  </head>
  <body>
    <strong>Shadowbill Collector</strong>
    <label class="row"><input id="enabled" type="checkbox" /> Enabled</label>
    <label for="collectorUrl">Collector URL</label>
    <input id="collectorUrl" />
    <label for="model">Model</label>
    <input id="model" />
    <label for="reasoningEffort">Reasoning effort</label>
    <select id="reasoningEffort">
      <option>none</option><option>low</option><option>medium</option><option>high</option>
      <option>xhigh</option><option>max</option><option>unknown</option>
    </select>
    <button id="save">Save and test</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
